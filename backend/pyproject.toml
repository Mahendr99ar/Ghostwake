[project]
name = "ghostwake"
version = "0.1.0"
description = "Maritime intelligence for the Indian Ocean: SAR + AIS fusion, dark vessel alerts, fishermen safety warnings."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.13",
    "h3>=4.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10"]
ml = ["ultralytics>=8.2", "rasterio>=1.3", "torch>=2.3"]
mcp = ["mcp>=2.0"]

[project.scripts]
ghostwake-pipeline = "ghostwake.pipeline:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ghostwake*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B905", "B008"]

[tool.ruff.lint.per-file-ignores]
"ghostwake/api/main.py" = ["E501"]  # the inline case-file template reads better unwrapped

[tool.pytest.ini_options]
testpaths = ["tests"]
